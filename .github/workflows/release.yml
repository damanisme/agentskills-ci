name: Release to PyPI

# Publishes on a GitHub Release using PyPI Trusted Publishing (OIDC) — no API
# token stored in the repo. One-time setup on PyPI: add a pending publisher for
# project `agentskills-ci`, owner `damanisme`, repo `agentskills-ci`,
# workflow `release.yml` (leave the Environment field blank).
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build distributions
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
