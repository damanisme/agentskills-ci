name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Self-score good example skills
        run: |
          agentskills-ci score examples/skills/good-skill
          agentskills-ci score examples/skills/fixed-skill
      - name: Bad example must fail the gate
        run: |
          if agentskills-ci check examples/skills/bad-skill; then
            echo "bad-skill unexpectedly passed the gate" >&2
            exit 1
          fi
          echo "bad-skill correctly failed the gate"
